; PHP errors of web requests (php-fpm only, the CLI keeps stderr) in a file, complete - nginx cuts the PHP errors it
; gets from php-fpm after ~1 KB (e.g. the stack trace of a fatal error). Read-only for the AI coding clients at
; /workspace/logs/php_errors.log. Note: these errors are then no longer in docker logs of web.
log_errors = On
error_log = /var/log/tine20/php_errors.log
