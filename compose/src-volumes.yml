services:
  web:
    # Note: these volumes add to docker-compose.yml (not to be combined with build.yml !)
    #
    # Sub paths of the tine checkout are mounted from the tine20-src volume (docker-compose.yml, bound to the
    # checkout root TINE20_DIR) instead of bind mounts: the daemon resolves `subpath`
    # beneath the volume without following symlinks, a bind mount of ./tine20/tine20 would follow a symlink
    # planted there by code running in a container. ./console docker:checkmounts rejects such bind mounts.
    #
    # Targets without a trailing slash: with one, Compose before 2.30 turned mounts of a volume bound to a host dir into
    # bind mounts of the volume name ("invalid mount path: 'tine20_tine20-src' mount path must be absolute").
    volumes:
      - type: volume
        source: tine20-src
        target: /usr/share/tine20
        read_only: true
        volume: { nocopy: true, subpath: tine20 }
      - type: volume
        source: tine20-src
        target: /usr/share/tests
        read_only: true
        volume: { nocopy: true, subpath: tests }
      - type: volume
        source: tine20-src
        target: /usr/share/scripts
        read_only: true
        volume: { nocopy: true, subpath: scripts }
