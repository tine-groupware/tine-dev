# Shared infrastructure for AI coding clients. Combine with one or more client modules in
# pullup.json, e.g. "composeFiles": [..., "aicoding", "aicoding-claude-code"]
#
# A client gets restricted docker access (exec into the tine web container only) by joining
# ai-proxy-net - socket-proxy allows any container in that subnet, so new clients don't need
# changes here.

services:
  gitlab-mcp:
    image: zereight050/gitlab-mcp:latest
    container_name: gitlab-mcp
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      STREAMABLE_HTTP: "true"
      STREAMABLE_HTTP_AUTH_TOKEN: "${MCP_AUTH_TOKEN}"
      MCP_ALLOWED_HOSTS: "gitlab-mcp,gitlab-mcp:3002"
      GITLAB_API_URL: "${GITLAB_API_URL}"
      GITLAB_PERSONAL_ACCESS_TOKEN: "${GITLAB_PERSONAL_ACCESS_TOKEN}"
      GITLAB_PERMISSION_MODE: "full"
      # pipeline and job tools (CI results)
      USE_PIPELINE: "true"
    networks:
      - internal_network
      - external_network

  socket-proxy:
    image: ghcr.io/tine-groupware/tine-dev/socket-proxy:1.12.2-mw1
    container_name: socket-proxy
    depends_on:
      web:
        condition: service_started
        # the allowlist below contains the id of web, so restart when web is recreated
        restart: true
    user: "0:998"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # empty ID would turn the exec allowlist below into "any container id" -> refuse to start
        ID=$(docker ps -aq -f "label=com.docker.compose.project=tine20" -f "label=com.docker.compose.service=web") && \
        if [ -z "$$ID" ] || [ "$$(echo "$$ID" | wc -l)" -ne 1 ]; then echo "socket-proxy: expected exactly one tine20 web container, got: '$$ID'" >&2; exit 1; fi && \
        exec /app/socket-proxy \
          '-loglevel=info' \
          '-listenip=0.0.0.0' \
          '-allowfrom=${AI_PROXY_SUBNET:-172.31.250.0/24}' \
          '-allowHEAD=/_ping' \
          '-allowGET=/(_ping$|v1\.[0-9]{1,2}/(version|containers/json|containers/[^/]+/json|exec/[a-f0-9]+/json))' \
          "-allowPOST=/v1\\.[0-9]{1,2}/(containers/(tine20-web-[0-9]+|$$ID[a-f0-9]*)/exec|exec/[a-f0-9]+/(start|resize))"
    networks:
      - ai-proxy-net

networks:
  # only AI coding clients + socket-proxy belong here (see -allowfrom above)
  ai-proxy-net:
    internal: true
    ipam:
      config:
        - subnet: ${AI_PROXY_SUBNET:-172.31.250.0/24}
