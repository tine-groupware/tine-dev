# Shared infrastructure for AI coding clients. Combine with one or more client modules in
# pullup.json, e.g. "composeFiles": [..., "aicoding", "aicoding-claude-code"]
#
# Clients get no docker access. devctl offers a fixed set of operations as MCP server (change branch, up,
# webpack restart, exec into the tine web container and the e2e test runner, logs, ...), see
# dockerfiles/devctl/devctl.php. A client joins devctl-net and gets the MCP server
# http://devctl:3003/mcp with "Authorization: Bearer ${MCP_AUTH_TOKEN}".

services:
  gitlab-mcp:
    image: zereight050/gitlab-mcp:latest
    container_name: gitlab-mcp
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      STREAMABLE_HTTP: "true"
      STREAMABLE_HTTP_AUTH_TOKEN: "${MCP_AUTH_TOKEN}"
      MCP_ALLOWED_HOSTS: "gitlab-mcp,gitlab-mcp:3002"
      GITLAB_API_URL: "${GITLAB_API_URL}"
      # GITLAB_ACCESS_TOKEN of .env, see README "Settings and tokens" (the key is the name gitlab-mcp reads)
      GITLAB_PERSONAL_ACCESS_TOKEN: "${GITLAB_ACCESS_TOKEN}"
      GITLAB_PERMISSION_MODE: "full"
      # pipeline and job tools (CI results)
      # toolsets active from the start (otherwise e.g. replying in review threads needs discover_tools first)
      GITLAB_TOOLSETS: "core,merge_requests,pipelines"
    networks:
      - internal_network
      - external_network

  devctl:
    # dockerfiles/devctl, built by the CI (tag devctl-image-<version>)
    image: ghcr.io/tine-groupware/tine-dev/devctl:1.4.0
    container_name: devctl
    restart: unless-stopped
    environment:
      DEVCTL_TOKEN: "${MCP_AUTH_TOKEN}"
      # ./console doesn't recreate these (DockerCommand::upServices): devctl itself, and the AI clients
      # (their env, e.g. ANTHROPIC_API_KEY, may only be set in your shell)
      DEVCTL_SKIP_SERVICES: "devctl claude-code opencode gitlab-mcp"
      # tine-dev and the checkout are mounted at their host paths: compose resolves relative bind
      # sources like on the host, the daemon gets host paths
      TINE_DEV_DIR: "${TINE_DEV_DIR}"
      TINE_DEV_USER: "${TINE_DEV_USER}"
      TINE_DEV_ARM64: "${TINE_DEV_ARM64}"
      HOME: "${HOMEDIR}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      # tools fetch / push (optional): git token of the tine repo, pushes only pu/<DEVCTL_DEVELOPER>/...
      # to DEVCTL_GIT_REMOTE, if its push url starts with DEVCTL_GIT_URL_PREFIX. The client never sees the token.
      GITLAB_GIT_TOKEN: "${GITLAB_GIT_TOKEN:-}"
      DEVCTL_DEVELOPER: "${DEVCTL_DEVELOPER:-}"
      DEVCTL_GIT_URL_PREFIX: "${DEVCTL_GIT_URL_PREFIX:-https://gitlab.metaways.net/}"
      DEVCTL_GIT_REMOTE: "${DEVCTL_GIT_REMOTE:-origin}"
      # runs as root, git and ./console as the owner of the checkout (devctl.php asOwner()). ./console runs git
      # with fsmonitor/hooks disabled.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    working_dir: "${TINE_DEV_DIR}"
    volumes:
      # pullup.json "trustedServices" (default contains devctl), see ./console docker:checkmounts
      - /var/run/docker.sock:/var/run/docker.sock
      - "${TINE_DEV_DIR}:${TINE_DEV_DIR}"
      - "${TINE20_DIR}:${TINE20_DIR}"
    networks:
      - devctl-net
      # git fetch/push (tools fetch, push)
      - external_network

  # logs for the clients (read-only at /workspace/logs, see the client modules): tine20.jsonl (tine log as JSON,
  # configs/aicoding/logger.inc.php) and php_errors.log (complete PHP errors of web requests). Emptied by
  # docker:up -d and docker:webpackrestart (DockerCommand::prepareAiLogs).
  web:
    volumes:
      - ./configs/aicoding/logger.inc.php:/etc/tine20/conf.d/aicoding-logger.inc.php:ro
      - ./configs/aicoding/php-fpm-errors.ini:/etc/php/default/fpm/conf.d/60-aicoding-errors.ini:ro
      # the image's /var/log/tine20 (owner tine20): a new volume takes over owner and content
      - tine20-logs:/var/log/tine20

volumes:
  tine20-logs:

networks:
  # only AI coding clients + devctl belong here
  devctl-net:
    internal: true
