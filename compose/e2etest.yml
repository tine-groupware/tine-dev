# e2e test runner (jest + puppeteer), see README "E2E tests"
#
#   docker exec e2etests npm install   # once / after package.json changes (AI clients: devctl exec)
#   docker exec e2etests npm test src/test/CrewScheduling/crewScheduling.test.js

services:
  e2etests:
    # the image of the e2e jobs of the tine CI (tine20/ci/helperimages/puppeteer, ci/gitlab-ci/test_js_jobs.yml),
    # built for amd64 and arm64 (IMAGE_SUFFIX -arm64, set by ./console)
    image: dockerregistry.metaways.net/tine20/tine20/puppeteer:2.1.0${IMAGE_SUFFIX:-}
    container_name: e2etests
    working_dir: /tine20/tests/e2etests
    # the image has no long running command, keep it running for exec sessions
    command: [ "sleep", "infinity" ]
    init: true
    shm_size: 1gb
    volumes:
      - "./tine20/:/tine20"
    networks:
      - internal_network
      # npm install
      - external_network

  # tests use TEST_URL from tests/e2etests/.env (https://tine.local.tine-dev.de); inside the
  # docker network that name has to point to traefik, which routes to web and webpack
  traefik:
    networks:
      internal_network:
        aliases:
          - "tine.${DOMAIN_SUFFIX:-local.tine-dev.de}"
