# e2e test runner (jest + puppeteer), see README "E2E tests"
#
#   docker exec e2etests npm install   # once / after package.json changes (AI clients: devctl exec)
#   docker exec e2etests npm test src/test/CrewScheduling/crewScheduling.test.js

services:
  e2etests:
    # dockerfiles/puppeteer, the same image the e2e jobs of the tine CI use, multi-platform (amd64, arm64)
    image: ghcr.io/tine-groupware/tine-dev/puppeteer:22-mw2
    container_name: e2etests
    working_dir: /tine20/tests/e2etests
    # the image has no long running command, keep it running for exec sessions
    command: [ "sleep", "infinity" ]
    init: true
    shm_size: 1gb
    volumes:
      - "./tine20/:/tine20"
    networks:
      - internal_network
      # npm install, Chrome of the host via chrome-proxy
      - external_network

  # Chrome of the host for the tests (TEST_BROWSER_URL=http://172.118.200.1:9222, see README "E2E tests").
  # Chrome only accepts debugging connections with an IP or localhost as Host header (not host.docker.internal),
  # and the IP of the host differs per platform. This proxy has a fixed IP and forwards to port 9222 of the host.
  chrome-proxy:
    image: alpine/socat:1.8.1.3
    container_name: chrome-proxy
    command: [ "TCP-LISTEN:9222,fork,reuseaddr", "TCP:host.docker.internal:9222" ]
    networks:
      external_network:
        ipv4_address: 172.118.200.1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # tests use TEST_URL from tests/e2etests/.env (https://tine.local.tine-dev.de); inside the
  # docker network that name has to point to traefik, which routes to web and webpack
  traefik:
    networks:
      internal_network:
        aliases:
          - "tine.${DOMAIN_SUFFIX:-local.tine-dev.de}"
